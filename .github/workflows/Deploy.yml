# This is a basic workflow to help you get started with Actions

name: DeployToLab

# Controls when the workflow will run
on:
  # Triggers the workflow on pull request events but only for the "master" branch
  pull_request:
    types: [closed]
    branches:
      - master

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Update repository on JAX-TASK001
      - name: Update Repo
        shell: cmd
        run: |
          git -C ~/git/PowerShell pull origin master

      - name: Get new version number and install on task server
        shell: PowerShell
        run: |
          $Version = (Select-String -Path ~/git/PowerShell/DupreeFunctions/DupreeFunctions.psd1 -Pattern "ModuleVersion").Line.Split('=')[1].Trim().Trim("'")
          mkdir /usr/local/share/powershell/Modules/DupreeFunctions/$Version
          mkdir /opt/microsoft/powershell/7/Modules/DupreeFunctions/$Version
          cp -r ~/git/PowerShell/DupreeFunctions/* /usr/local/share/powershell/Modules/DupreeFunctions/$Version
          cp -r ~/git/PowerShell/DupreeFunctions/* /opt/microsoft/powershell/7/Modules/DupreeFunctions/$Version

      # Publish DupreeFunctions to PSG
      # - name: Publish to PowerShell Gallery
      #   shell: PowerShell
      #   run: |
      #     Publish-Module -Path ~/git/PowerShell/DupreeFunctions -NuGetApiKey ${{secrets.PSG_API_KEY}}

      # - name: Check-NuGet
      #   shell: powershell
      #   run: |
      #     C:\actions-runner\Check-NuGet.ps1

      # - name: Update-Task-Server
      #   shell: powershell
      #   run: |
      #     Start-Sleep -Seconds 30
      #     Update-Module DupreeFunctions

      - name: Update-DfLabBoxes
        shell: powershell
        run: |
          Import-Module DupreeFunctions
          Update-DfLabBoxes -WinData ${{secrets.WINDATA}} -LnxData ${{secrets.LNXDATA}}