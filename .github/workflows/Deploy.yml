# Deploys DupreeFunctions to the lab machines when a PR is merged into master

name: DeployToLab

# Controls when the workflow will run
on:
  # Triggers the workflow on pull request events but only for the "master" branch
  pull_request:
    types: [closed]
    branches:
      - master
  # Allows a redeploy to be kicked off by hand without merging anything
  workflow_dispatch:

# Only one deployment at a time so two merges cannot fight over the same targets
concurrency:
  group: deploy-to-lab
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    # Dedicated label so this only ever lands on JAX-WKN001L (linux, runs as github-runner)
    runs-on: [self-hosted, jax-wkn001l]
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v5

      # Reaches Windows and Linux targets alike over PowerShell SSH remoting.
      # Each target refreshes its own git clone and installs into its system module paths.
      - name: Deploy to lab machines
        shell: pwsh
        env:
          DF_DEPLOY_SSH_KEY: ${{ secrets.DF_DEPLOY_SSH_KEY }}
        run: ./GitHubActions/Invoke-DfDeploy.ps1
