# This is a basic workflow to help you get started with Actions

name: VersionUpdate

# Controls when the workflow will run
on:
  # Triggers the workflow on pull request events but only for the "master" branch
  pull_request:
    types: [closed]
    branches:
      - version

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: self-hosted
    permissions:
      contents: write
    if: github.event.pull_request.merged == true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      # Update repository on JAX-TASK001
      - name: Update Repo
        shell: pwsh
        run: |
          git -C ~/git/PowerShell fetch origin
          git -C ~/git/PowerShell checkout version
          git -C ~/git/PowerShell reset --hard origin/version

      - name: Update Version
        shell: pwsh
        run: |
          Import-Module ~/git/PowerShell/DupreeFunctions/DupreeFunctions.psd1 -Force
          Update-DfModuleVersion

      # Publish DupreeFunctions to PSG
      - name: Update Branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C ~/git/PowerShell add ~/git/PowerShell/DupreeFunctions/DupreeFunctions.psd1
          git -C ~/git/PowerShell commit -m "Version Updated"
          git -C ~/git/PowerShell push "https://x-access-token:$env:GH_TOKEN@github.com/compengevfan/PowerShell.git" version
      #V12
